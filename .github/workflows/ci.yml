name: ZipRIGHT CI

on:
  push:
    branches: [main]
    paths:
      - "zipfin-backend/**"
      - "zipfend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "zipfin-backend/**"
      - "zipfend/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zipfin-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zipfin-backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install lightweight subset — skip torch/playwright/mediapipe for CI speed
          pip install \
            fastapi uvicorn[standard] gunicorn pydantic python-dotenv \
            firebase-admin google-cloud-firestore google-api-core \
            httpx requests beautifulsoup4 pillow \
            pytest pytest-asyncio anyio

      - name: Run tests
        env:
          ENV: test
          FIRESTORE_DATABASE_ID: "(default)"
          FIREBASE_PROJECT_ID: ci-project
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpA==\n-----END RSA PRIVATE KEY-----"
          FIREBASE_CLIENT_EMAIL: ci@ci-project.iam.gserviceaccount.com
        run: |
          python -m pytest tests/ -v --tb=short

  # ── Frontend: TypeScript typecheck ─────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zipfend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zipfend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

  # ── Docker: build validation (no push) ────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./zipfin-backend
          file: ./zipfin-backend/Dockerfile
          push: false
          tags: zipright-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build only the runtime stage for speed; skip full Playwright install
          target: builder
