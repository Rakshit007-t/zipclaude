<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="cardGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2D2620"/>
      <stop offset="60%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </radialGradient>
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA9F"/>
      <stop offset="50%" stop-color="#C68B59"/>
      <stop offset="100%" stop-color="#844F27"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3D31"/>
      <stop offset="50%" stop-color="#2A241E"/>
      <stop offset="100%" stop-color="#3D3025"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#cardGlow)"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#332B23" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#332B23" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Eyebrow Badge -->
  <g transform="translate(100, 140)">
    <rect width="210" height="36" rx="18" fill="#201C18" stroke="#3D342B" stroke-width="1"/>
    <text x="105" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#D8A578" letter-spacing="3" text-anchor="middle">THE FIT ATELIER</text>
  </g>

  <!-- Main Wordmark & Headline -->
  <text x="100" y="275" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="300" fill="#F5EFE6" letter-spacing="-1">
    Fit is <tspan fill="url(#brandGold)" font-weight="500" font-style="italic">everything.</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="300" fill="#A89E91" letter-spacing="0.5">
    AI virtual try-on on your own photo &amp; guaranteed size confidence across any brand.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="46" rx="23" fill="#1C1A17" stroke="#332C24" stroke-width="1"/>
    <text x="130" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="#E8DED1" text-anchor="middle">✦ 3D Body Measurement</text>

    <!-- Pill 2 -->
    <rect x="280" y="0" width="260" height="46" rx="23" fill="#1C1A17" stroke="#332C24" stroke-width="1"/>
    <text x="410" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="#E8DED1" text-anchor="middle">✦ Neural Virtual Try-On</text>

    <!-- Pill 3 -->
    <rect x="560" y="0" width="260" height="46" rx="23" fill="#1C1A17" stroke="#332C24" stroke-width="1"/>
    <text x="690" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="#E8DED1" text-anchor="middle">✦ Zero Sold Biometrics</text>
  </g>

  <!-- Footer branding -->
  <text x="100" y="520" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="600" fill="#F5EFE6" letter-spacing="2">
    Zip<tspan fill="#C68B59">RIGHT</tspan>
  </text>
  <text x="1100" y="520" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400" fill="#8C8174" text-anchor="end">
    zipright.ai
  </text>
</svg>
